# Serving-class supplement: which tools an Oyzu proxy may store and serve.
# Classes and rules were decided 2026-10-10 (project notes, tool-licensing.md):
# permissive licenses map to `cache`, copyleft to `cache` with the source
# mirrored, BSL/FSL to `cache-source-available`, and anything unknown to
# `direct`. `class` overrides the mapping.
#
# Every entry below was reviewed 2026-10-10 (serving-class review, slice 4
# Q4): each declared license was checked against the license text in the
# repository at a release tag, and against the license files inside the
# shipped linux/amd64 archive where the index had records. Two entries are
# overridden to `direct`: minio/mc and core:python (see their notes).
#
# Not listed, so `direct`: oven-sh/bun (bundles LGPL WebKit components; needs a
# closer look) and snyk/cli (binary terms differ from the repository license).
# Oracle JDK, Oracle GraalVM and the Android SDK are never proxied: the job
# keeps any tool id naming oracle, graalvm or android at `direct` (or
# `excluded`) whatever its entry says (src/serving.rs, NEVER_PROXIED).

[tools."aqua:cli/cli"]
license = "MIT"
reviewed = true

