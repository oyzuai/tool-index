# Pins and limits for the tool index job. Changing a pin is a reviewed change:
# the job's pull request then waits for a person (see src/review.rs).

# Platforms the verified tier resolves and downloads. musl is not supported in
# the first release (decided 2026-10-10).
platforms = ["linux/amd64/gnu", "linux/arm64/gnu", "darwin/arm64/native", "darwin/amd64/native", "windows/amd64/msvc"]

# The registry snapshot every aqua record is resolved from. Bumping the tag
# needs the new file's digest; `tool-index fetch` refuses any other bytes.
[aqua_registry]
source = "aquaproj/aqua-registry"
tag = "v4.573.0"
digest = "sha256:52a43b0b2817a56fe7566625809d7cca41a1178ccae2b152941221b516e70228"
registry_url = "https://raw.githubusercontent.com/aquaproj/aqua-registry/{tag}/registry.yaml"
license_url = "https://raw.githubusercontent.com/aquaproj/aqua-registry/{tag}/LICENSE"

# Short names, from the same mise release oyzu pins in
# src/tools/development/declare/short_names.rs. Keep the two in step.
[names]
source = "mise"
version = "2026.10.5"
digest = "sha256:ee67f0e98cb4bcca979cfc31aed712b351c1632796e25d63c33a43f198dae98a"
url = "https://static.crates.io/crates/mise/mise-2026.10.5.crate"

[discovery]
# Newest versions kept per tool. The index is one file at launch (decided
# 2026-10-10), so this bounds its size.
max_versions = 50
# Binary recipes the CLI can install. Build-from-source kinds are left out.
source_kinds = ["github_release", "http"]

[verified]
# Newest versions downloaded and checked when a tool joins the launch set.
backfill = 3
# Most versions verified in one run; the rest wait for the next run. New
# versions go first, then due retries, each in core-provider then launch-set
# order. 150 verified about 50 tools in 5 minutes (2026-10-10, first run); 400
# covers every launch-set tool's backfill plus new releases and core providers
# in one run, well inside the job's 180-minute limit.
max_versions_per_run = 400
# Versions per tool whose records stay in the index; older versions keep their
# date but lose their records, which bounds the single file.
# Measured 2026-10-10 on a full build (2,214 tools, 71k versions): 19 MB with 3
# versions of records per launch-set tool, 31 MB with 10; zstd -19 makes them
# 0.9 MB and 1.4 MB. The CLI fetches the compressed copy and reuses a copy for
# an hour, so the index stays one file (no per-tool split).
keep_records = 10
include_prereleases = false
# A version that failed verification is retried after this many days, or at
# once when the job's oyzu pin changes (index/attempts.json says why it failed).
retry_after_days = 7

[signing]
# Expiry of targets, snapshot and timestamp. The job re-signs daily.
expires_days = 14

# Core providers, built into the job rather than read from the registry.
# `verified = true`: new versions get records from `oyzu tools evidence
# --provider <name>` (backfill and budget as for the launch set), carried
# under the `oyzu:` id with origin `core:<name>`.
#
# `line = N`: the first N version components name a release line. Then
# `max_versions`, the backfill and `keep_records` count per line, and `lines`
# keeps the newest lines, so `java@21` or `node@lts` finds verified records
# even when newer lines have more releases.
[core.java]
# Eclipse Temurin JDK. oyzu installs it for linux/amd64/gnu,
# linux/arm64/gnu, darwin/arm64/native and windows/amd64/msvc; other
# platforms get `unsupported` records.
names = ["java"]
max_versions = 50
verified = true
line = 1
keep_records = 3

# Node.js from nodejs.org/dist, the archives `oyzu install node` uses,
# verified against each release's SHASUMS256.txt. Lines are majors; 22.x and
# the newer LTS lines are what `lts` and `lts/<codename>` select.
[core.node]
names = ["node"]
max_versions = 30
verified = true
line = 1
lines = 6
keep_records = 3

# Go from go.dev/dl, verified against each archive's `.sha256` sidecar. Lines
# are minors (1.25); Go supports the newest two.
[core.go]
names = ["go"]
max_versions = 30
verified = true
line = 2
lines = 4
keep_records = 3

# CPython from python-build-standalone's current release (install_only
# builds), verified against the release's SHA256SUMS. Lines are minors (3.13).
# The publisher's current release carries one patch per minor; earlier
# patches keep the records they were verified with.
[core.python]
names = ["python"]
max_versions = 30
verified = true
line = 2
lines = 6
keep_records = 3

# Oyzu's other archive providers, Maven through Rust below: each record names
# the archive the CLI installs, from the same publisher, checked against the
# publisher's published checksum by `oyzu tools evidence --provider`.
#
# Apache Maven from archive.apache.org. Lines are minors (3.9).
[core.maven]
names = ["maven"]
max_versions = 20
verified = true
line = 2
lines = 3
keep_records = 3

# Gradle from services.gradle.org. Lines are majors.
[core.gradle]
names = ["gradle"]
max_versions = 30
verified = true
line = 1
lines = 3
keep_records = 3

# Helm from get.helm.sh; versions are helm/helm's release tags. Lines are
# minors.
[core.helm]
names = ["helm"]
max_versions = 20
verified = true
line = 2
lines = 4
keep_records = 3

# kubectl from dl.k8s.io; versions are kubernetes/kubernetes release tags. Lines are minors; the
# newest four cover Kubernetes' supported releases and version skew.
[core.kubectl]
names = ["kubectl"]
max_versions = 20
verified = true
line = 2
lines = 4
keep_records = 3

# k3d from its GitHub releases.
[core.k3d]
names = ["k3d"]
max_versions = 20
verified = true

# Liquibase from its GitHub releases. 5.x is FSL-1.1 (source-available).
[core.liquibase]
names = ["liquibase"]
max_versions = 20
verified = true

# Tailscale's stable track (even minors) from pkgs.tailscale.com.
[core.tailscale]
names = ["tailscale"]
max_versions = 20
verified = true

# npm and pnpm from the npm registry. Lines are majors.
[core.npm]
names = ["npm"]
max_versions = 30
verified = true
line = 1
lines = 3
keep_records = 3

[core.pnpm]
names = ["pnpm"]
max_versions = 30
verified = true
line = 1
lines = 3
keep_records = 3

# Rust toolchains from static.rust-lang.org: each record carries the
# component tarballs the CLI installs, with the sha256 the release's channel
# manifest gives them. Versions are rust-lang/rust release tags.
[core.rust]
names = ["rust"]
max_versions = 20
verified = true
