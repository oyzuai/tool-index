# The verified tier: Oyzu's curated launch set (approved as the starting list
# 2026-10-10). New versions of these
# tools are downloaded and checked as they appear; other packages are indexed
# at the discovery tier (versions and dates only).
#
# `name` is the tool's curated short name, its id `oyzu:<name>`: the mise
# catalog's primary name, as the oyzu CLI's table has it
# (src/tools/development_backend/names.rs). A tool without one, because its
# name would collide with an Oyzu core tool or it has no catalog name, and
# every discovery-tier tool, is `oyzu:<owner>/<repo>`.

