# Signs and publishes the index when main changes, and re-signs daily so the
# 14-day expiry never lapses.
#
# Signing is Sigstore keyless (decided by Micah Martin, 2026-10-10): cosign
# gets a short-lived certificate for this workflow's GitHub OIDC identity and
# records the signature in the public Rekor log. There is no key to hold. The
# oyzu CLI pins exactly this identity:
#   https://github.com/oyzuai/tool-index/.github/workflows/release.yml@refs/heads/main
# issued by https://token.actions.githubusercontent.com on a github-hosted
# runner. Renaming this file or signing from another ref breaks every client.
name: Release

on:
  push:
    branches: [main]
    paths: [index/index.json, index/NOTICE]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write   # gh release create
  id-token: write   # the OIDC token cosign exchanges for a signing certificate

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only main signs: the certificate names the ref, and clients accept
    # refs/heads/main only.
    if: github.ref == 'refs/heads/main'
    # GitHub-hosted only (decided 2026-10-10); clients check the runner
    # environment in the certificate.
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/oyzu-read
        with:
          app-id: ${{ secrets.OYZU_READ_APP_ID }}
          private-key: ${{ secrets.OYZU_READ_APP_PRIVATE_KEY }}

      - name: Build the job
        run: cargo build --release --locked

      - name: Drop the oyzu read token
        run: .github/actions/oyzu-read/done.sh

      - name: Download the published index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published
          if gh release view --json tagName > /dev/null 2>&1; then
            gh release download --pattern index.json --dir published
          else
            echo "No release yet: this is serial 1."
          fi

      # Same content, new serial and expiry: the daily run re-signs unchanged
      # content so a copy is never older than signing.expires_days.
      - name: Stamp serial and expiry
        run: |
          published=$([ -f published/index.json ] && echo "--published published/index.json" || true)
          ./target/release/tool-index stamp $published --index index/index.json --out release/index.json
          cp index/NOTICE release/NOTICE

      - name: Install cosign
        # v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Sign
        working-directory: release
        run: cosign sign-blob --yes --bundle index.json.sigstore.json index.json

      - name: Verify as the CLI will
        working-directory: release
        run: |
          cosign verify-blob --bundle index.json.sigstore.json \
            --certificate-identity https://github.com/oyzuai/tool-index/.github/workflows/release.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            index.json

      # Transport only: the CLI fetches this (about a twentieth of index.json's
      # size, measured 2026-10-10) and checks the signature against the
      # decompressed bytes. `tool-index release` checks it decompresses to
      # exactly index.json.
      - name: Compress
        working-directory: release
        run: zstd -19 -q -o index.json.zst index.json

      - name: Check the release assets
        id: plan
        run: |
          ./target/release/tool-index release --dir release > plan.json
          cat plan.json
          echo "tag=$(jq -r .tag plan.json)" >> "$GITHUB_OUTPUT"
          echo "notes=Index serial $(jq -r .serial plan.json), expires $(jq -r .expires plan.json)" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          NOTES: ${{ steps.plan.outputs.notes }}
        run: |
          gh release create "$TAG" --latest --title "$TAG" --notes "$NOTES" \
            release/index.json release/index.json.zst release/index.json.sigstore.json release/NOTICE
