# Required check on every pull request to the index repository. It recomputes
# the review decision from the base branch, so a pull request labeled routine
# that is not routine fails instead of auto-merging.
#
# The needs-review gate is the separate `index-review` commit status, because
# rulesets cannot require a review only for some pull requests. The `gate` job
# sets it to success when the decision needs no review or someone with write
# access has approved the current head commit, and leaves it pending otherwise,
# so a valid update waiting for its approval shows `verify` green and
# `index-review` pending rather than a failed check. A review re-runs both.
name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

# One group per event, so a pull request event does not cancel the run a
# review started.
concurrency:
  group: verify-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.review.outputs.decision }}
    steps:
      # v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/oyzu-read
        with:
          app-id: ${{ secrets.OYZU_READ_APP_ID }}
          private-key: ${{ secrets.OYZU_READ_APP_PRIVATE_KEY }}
      - run: cargo build --release --locked
      - run: cargo test --locked
      - run: cargo test --locked --manifest-path release-tool/Cargo.toml
      - name: Drop the oyzu read token
        run: .github/actions/oyzu-read/done.sh
      - name: Recompute the review decision
        id: review
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Before the first index lands there is nothing to review: a pull
          # request without index/index.json changes code only, which the
          # ruleset's code-owner review covers.
          if [ ! -f index/index.json ]; then
            echo "no index/index.json in this pull request"
            echo "decision=no-change" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(git show "origin/$BASE:index/index.json" > previous.json 2>/dev/null && echo "--previous previous.json" || true)
          ./target/release/tool-index review $previous --next index/index.json > review.json
          decision=$(jq -r .decision review.json)
          echo "decision: $decision"
          jq -r '.reasons[]' review.json
          case ",$LABELS," in
            *,routine,*) [ "$decision" != review ] || { echo "labeled routine but needs review"; exit 1; } ;;
          esac
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

  # Runs none of the pull request's code: it only reads reviews and sets the
  # `index-review` status, so the write permission never reaches the build.
  # Skipped when `verify` fails, which leaves the status unset and the merge
  # blocked.
  gate:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Set the index-review status
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ needs.verify.outputs.decision }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status() {
            echo "$1: $2"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$1" -f context=index-review -f description="$2" \
              -f target_url="$RUN_URL" > /dev/null
          }
          if [ "$DECISION" != review ]; then
            status success "No review needed ($DECISION)"
            exit 0
          fi
          # Each reviewer's latest decisive review (approve, request changes,
          # dismissed) counts, and only for the current head commit. Reviews
          # are read live, so whichever run finishes last sets the right state.
          approvers=$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              --jq '.[] | select(.state != "COMMENTED" and .state != "PENDING") | "\(.user.login) \(.state) \(.commit_id)"' |
            awk '{ last[$1] = $2 " " $3 } END { for (u in last) print u, last[u] }' |
            while read -r user state commit; do
              [ "$state" = APPROVED ] && [ "$commit" = "$HEAD_SHA" ] || continue
              permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$user/permission" --jq .permission)
              case "$permission" in admin|write) echo "$user" ;; esac
            done
          )
          if [ -z "$approvers" ]; then
            status pending "Needs review: approve the current commit (write access required)"
          else
            status success "Approved by $(echo $approvers | tr ' ' ',')"
          fi
