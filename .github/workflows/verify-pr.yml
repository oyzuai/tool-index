# Required check on every pull request to the index repository. It recomputes
# the review decision from the base branch, so a pull request labeled routine
# that is not routine fails instead of auto-merging.
#
# It is also the needs-review gate, because rulesets cannot require a review
# only for some pull requests: when the recomputed decision is `review`, the
# check passes only once someone with write access has approved the pull
# request's current head commit. A review re-runs it.
name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  actions: write   # re-run the pull request's own verify run after an approval

# One group per event, so re-running the pull_request run after an approval
# does not cancel the review run that started it.
concurrency:
  group: verify-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/oyzu-read
        with:
          app-id: ${{ secrets.OYZU_READ_APP_ID }}
          private-key: ${{ secrets.OYZU_READ_APP_PRIVATE_KEY }}
      - run: cargo build --release --locked
      - run: cargo test --locked
      - name: Drop the oyzu read token
        run: .github/actions/oyzu-read/done.sh
      - name: Recompute the review decision
        id: review
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Before the first index lands there is nothing to review: a pull
          # request without index/index.json changes code only, which the
          # ruleset's code-owner review covers.
          if [ ! -f index/index.json ]; then
            echo "no index/index.json in this pull request"
            echo "decision=no-change" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(git show "origin/$BASE:index/index.json" > previous.json 2>/dev/null && echo "--previous previous.json" || true)
          ./target/release/tool-index review $previous --next index/index.json > review.json
          decision=$(jq -r .decision review.json)
          echo "decision: $decision"
          jq -r '.reasons[]' review.json
          case ",$LABELS," in
            *,routine,*) [ "$decision" != review ] || { echo "labeled routine but needs review"; exit 1; } ;;
          esac
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Require an approval from someone with write access
        if: steps.review.outputs.decision == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Each reviewer's latest decisive review (approve, request changes,
          # dismissed) counts, and only for the current head commit.
          approvers=$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              --jq '.[] | select(.state != "COMMENTED" and .state != "PENDING") | "\(.user.login) \(.state) \(.commit_id)"' |
            awk '{ last[$1] = $2 " " $3 } END { for (u in last) print u, last[u] }' |
            while read -r user state commit; do
              [ "$state" = APPROVED ] && [ "$commit" = "$HEAD_SHA" ] || continue
              permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$user/permission" --jq .permission)
              case "$permission" in admin|write) echo "$user" ;; esac
            done
          )
          if [ -z "$approvers" ]; then
            echo "This update needs review: approve the current commit (write access required)."
            exit 1
          fi
          echo "approved by: $approvers"

      # A review starts its own run, which GitHub lists beside the pull
      # request's earlier failed run for the same commit; the earlier failure
      # keeps blocking the merge until it is re-run. Re-run it once the
      # approval has passed here.
      - name: Re-run the pull request's earlier verify
        if: github.event_name == 'pull_request_review' && steps.review.outputs.decision == 'review'
        # A fork's review run gets a read-only token; the approval itself passed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow verify-pr.yml \
            --commit "$HEAD_SHA" --event pull_request --limit 1 \
            --json databaseId,conclusion --jq '.[] | select(.conclusion != "success") | .databaseId' |
            while read -r id; do gh run rerun "$id" --repo "$GITHUB_REPOSITORY"; done
