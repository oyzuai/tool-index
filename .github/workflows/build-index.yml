# Daily index build.
#
# Runs on GitHub-hosted runners only (decided 2026-10-10): the repository is
# public, and a self-hosted runner would let fork pull requests run code on it.
#
# The pull request is pushed, opened and auto-merged as the oyzu-index-bot
# GitHub App (secrets INDEX_BOT_APP_ID and INDEX_BOT_PRIVATE_KEY), not with
# github.token: events caused by GITHUB_TOKEN start no workflows, so the
# required `verify` check would never run and a merge would never trigger
# release.yml. The App is a separate identity so a maintainer can approve its
# needs-review pull requests.
name: Build index

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The bot token is minted only for the last step; the build and the
          # oyzu runs before it never see it.
          persist-credentials: false

      - uses: ./.github/actions/oyzu-read
        with:
          app-id: ${{ secrets.OYZU_READ_APP_ID }}
          private-key: ${{ secrets.OYZU_READ_APP_PRIVATE_KEY }}

      - name: Install the pinned oyzu
        run: |
          # Placeholder until oyzu publishes signed release binaries: build it
          # from the commit pinned in Cargo.toml for oyzu-recipe.
          rev=$(sed -n 's/.*oyzu-recipe = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          cargo install --locked --git https://github.com/oyzuai/oyzu --rev "$rev" oyzu --root "$RUNNER_TEMP/oyzu"
          echo "$RUNNER_TEMP/oyzu/bin" >> "$GITHUB_PATH"
          echo "OYZU_REV=$rev" >> "$GITHUB_ENV"

      - name: Build the job
        run: cargo build --release --locked

      - name: Drop the oyzu read token
        run: .github/actions/oyzu-read/done.sh

      - name: Fetch pinned inputs
        run: ./target/release/tool-index fetch

      - name: List versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/release/tool-index list --source github

      - name: Build index.json
        env:
          # `oyzu tools evidence` lists GitHub artifact attestations from the
          # API; the token raises its rate limit (sent to api.github.com only).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          previous=$([ -f index/index.json ] && echo "--previous index/index.json" || true)
          # index/attempts.json holds versions that failed verification and
          # why; they wait retry_after_days, or retry at once under a new pin.
          ./target/release/tool-index build $previous \
            --listing work/listing.json \
            --oyzu "$(command -v oyzu)" \
            --attempts index/attempts.json --engine-rev "$OYZU_REV" \
            --out index > work/build-report.json
          cat work/build-report.json

      - name: Review rules
        id: review
        run: |
          previous=$(git show HEAD:index/index.json > work/previous.json 2>/dev/null && echo "--previous work/previous.json" || true)
          ./target/release/tool-index review $previous \
            --next index/index.json --markdown work/pr-body.md > work/review.json
          echo "decision=$(jq -r .decision work/review.json)" >> "$GITHUB_OUTPUT"

      - name: Mint the index bot token
        id: bot
        if: steps.review.outputs.decision != 'no-change'
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.INDEX_BOT_APP_ID }}
          private-key: ${{ secrets.INDEX_BOT_PRIVATE_KEY }}
          repositories: tool-index

      - name: Open the pull request
        if: steps.review.outputs.decision != 'no-change'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DECISION: ${{ steps.review.outputs.decision }}
        run: |
          branch="index/$(date -u +%Y-%m-%d)"
          git config user.name "${{ steps.bot.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.bot.outputs.app-slug }}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add index/index.json index/NOTICE index/attempts.json
          git commit -m "index: update $(date -u +%Y-%m-%d)"
          # Pushed with the bot token too, so the pushes run the `verify` check.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          label=$([ "$DECISION" = routine ] && echo routine || echo needs-review)
          gh pr create --title "Index update $(date -u +%Y-%m-%d)" \
            --body-file work/pr-body.md --label "$label" --head "$branch" || \
            gh pr edit "$branch" --body-file work/pr-body.md --add-label "$label"
          # Routine bumps merge on their own once required checks pass. The
          # ruleset requires the `verify` check, which holds a needs-review
          # pull request until someone with write access approves it; the bot
          # must not be on the ruleset's bypass list.
          if [ "$DECISION" = routine ]; then
            gh pr merge "$branch" --auto --squash
          fi
